<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2FAF4">
<title>Golda Nocillado | Digital Business Card</title>

<style>
:root {
  --bg: #F2FAF4;
  --card: #FFFFFF;
  --ink: #1E3328;
  --muted: #5F7A6B;
  --brand: #2E8B57;
  --brand-ink: #FFFFFF;
  --line: #D5EBDD;
  --soft: #E6F5EB;
}

* {
  box-sizing: border-box;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(145deg, #F4FBF6, #DFF2E6);
  color: var(--ink);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}

/* Main Card */
.card {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 36px 24px 28px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(30, 100, 60, 0.10);
}

/* Profile Picture */
.photo {
  width: 136px;
  height: 136px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #B7E0C6;
  display: block;
  margin: 0 auto 18px;
  box-shadow: 0 4px 16px rgba(46, 139, 87, 0.15);
}

/* Name */
h1 {
  font-size: 1.7rem;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
  color: var(--ink);
}

/* Job Title */
.role {
  margin: 0 0 26px;
  color: var(--muted);
  font-size: 1.02rem;
}

/* Buttons */
.btn {
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 15px 16px;
  margin-top: 12px;
  border-radius: 14px;
  font-size: 1.05rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  border: 2px solid var(--brand);
  transition: all 0.2s ease;
}

.btn:focus-visible {
  outline: 3px solid #7CC79A;
  outline-offset: 3px;
}

/* Primary Green Button */
.primary {
  background: var(--brand);
  color: var(--brand-ink);
}

.primary:hover {
  background: #256F47;
  border-color: #256F47;
  transform: translateY(-2px);
}

/* Secondary Buttons */
.ghost {
  background: var(--soft);
  color: var(--brand);
  border-color: var(--line);
}

.ghost:hover {
  background: #D3ECDB;
  border-color: #A9D8BA;
  transform: translateY(-2px);
}

.btn:active {
  transform: scale(0.98);
}

.btn svg {
  width: 22px;
  height: 22px;
  flex: none;
}

@media (prefers-reduced-motion: reduce) {
  .btn {
    transition: none;
  }
}
</style>
</head>

<body>

<main class="card">

  <!-- Profile Picture -->
  <img
    class="photo"
    src="golda.png"
    alt="Photo of Golda Nocillado"
  >

  <!-- Name and Position -->
  <h1>Golda Nocillado</h1>
  <p class="role">Senior Supply Chain Associate</p>

  <!-- Message on Viber -->
  <a
    class="btn primary"
    href="viber://chat?number=%2B639174703896"
  >
    <svg viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>
    </svg>
    Message on Viber
  </a>

  <!-- Call on Viber -->
  <a
    class="btn ghost"
    href="viber://contact?number=%2B639174703896"
  >
    <svg viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
    </svg>
    Call on Viber
  </a>

  <!-- Call by Phone -->
  <a
    class="btn ghost"
    href="tel:+639174703896"
  >
    <svg viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
    </svg>
    Call by Phone
  </a>

  <!-- Email -->
  <a
    class="btn ghost"
    id="mail"
    href="mailto:golda.nocillado@wamrus.com"
  >
    <svg viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <path d="m3 7 9 6 9-6"/>
    </svg>
    Email Me
  </a>

</main>

<script>
(function () {
  var mail = document.getElementById("mail");

  mail.addEventListener("click", function (e) {
    e.preventDefault();

    var done = false;

    function onVisibilityChange() {
      if (document.hidden) {
        done = true;
      }
    }

    document.addEventListener(
      "visibilitychange",
      onVisibilityChange
    );

    window.location.href =
      "ms-outlook://compose?to=golda.nocillado@wamrus.com";

    setTimeout(function () {
      document.removeEventListener(
        "visibilitychange",
        onVisibilityChange
      );

      if (!done) {
        window.location.href =
          "mailto:golda.nocillado@wamrus.com";
      }
    }, 1200);
  });
})();
</script>

</body>
</html>
